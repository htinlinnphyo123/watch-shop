; Copy this file to /etc/supervisor/conf.d/watch-shop-import-worker.conf
; Replace the paths and user for your production server.

[program:watch-shop-import-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/watch-shop/artisan queue:work watch-imports --queue=watch-imports --sleep=3 --tries=1 --timeout=900 --memory=256 --max-time=3600
directory=/var/www/watch-shop
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/watch-shop-import-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=960
stopsignal=TERM

